
name: Build Universal Mod Menu APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o UniversalModMenu-Android-Starter.zip

      - name: Build APK
        run: |
          cd UniversalModMenu
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalModMenu-APK
          path: UniversalModMenu/app/build/outputs/apk/debug/app-debug.apk
          
